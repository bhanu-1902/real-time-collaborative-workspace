version: '3.8'

services:
  # Oracle Database
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: rtcw-oracle
    environment:
      - ORACLE_PWD=password123
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/oracle/init:/opt/oracle/scripts/startup
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s sys/password123@//localhost:1521/XE as sysdba"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - rtcw-network

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: rtcw-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - rtcw-network

  # Backend Spring Boot Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rtcw-backend
    environment:
      - SPRING_PROFILES_ACTIVE=development
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - SPRING_DATASOURCE_USERNAME=sys as sysdba
      - SPRING_DATASOURCE_PASSWORD=password123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=your-256-bit-secret-key-here-for-development-only
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
      - "8000:8000"  # Debug port
    volumes:
      - ./backend/src:/app/src
      - ./backend/target:/app/target
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rtcw-network
    restart: unless-stopped

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rtcw-frontend
    environment:
      - REACT_APP_GRAPHQL_URI=http://localhost:8080/graphql
      - REACT_APP_GRAPHQL_WS_URI=ws://localhost:8080/graphql
      - REACT_APP_API_BASE_URL=http://localhost:8080
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rtcw-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: rtcw-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - frontend
      - backend
    networks:
      - rtcw-network
    restart: unless-stopped

  # PostgreSQL (Alternative to Oracle for development)
  postgres:
    image: postgres:15-alpine
    container_name: rtcw-postgres
    environment:
      - POSTGRES_DB=rtcw_dev
      - POSTGRES_USER=rtcw_user
      - POSTGRES_PASSWORD=rtcw_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtcw_user -d rtcw_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rtcw-network
    profiles:
      - postgres  # Use with: docker-compose --profile postgres up

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: rtcw-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - rtcw-network
    profiles:
      - monitoring

  # Grafana for Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: rtcw-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - rtcw-network
    profiles:
      - monitoring

  # Mailhog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: rtcw-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - rtcw-network
    profiles:
      - email-testing

volumes:
  oracle_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  rtcw-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Development profiles:
# docker-compose up                           # Basic setup (Oracle + Redis + Backend + Frontend)
# docker-compose --profile postgres up        # Use PostgreSQL instead of Oracle
# docker-compose --profile monitoring up      # Include Prometheus + Grafana
# docker-compose --profile email-testing up   # Include Mailhog for email testing